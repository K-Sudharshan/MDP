<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Firefighting Robot Controller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#10110e;--panel:#252721;--panel2:#1b1d19;--edge:#3d3e37;--cream:#eadfc2;--muted:#9a9380;
  --brass:#c09a45;--amber:#ffb43a;--red:#c8281d;--green:#6fcf79;--yellow:#e3b02d;
  --serif:"Zilla Slab",Rockwell,"Courier New",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --screw:radial-gradient(circle,#b0ab9a 0,#716f63 38%,#35352f 60%,transparent 66%);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--cream);font-family:var(--serif);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background:radial-gradient(70% 50% at 50% 0,#2a2a22 0,transparent 70%),var(--bg)}
.app{max-width:1040px;margin:0 auto;padding:24px 20px 40px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.badge{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#2b1d05;
  background:radial-gradient(circle at 35% 28%,#f1d58c,var(--brass) 55%,#7c5f22);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.6)}
.badge svg{width:22px;height:22px}
.brand h1{margin:0;font:700 22px/1.1 var(--serif);letter-spacing:.01em;text-shadow:0 1px 0 #000}
.brand p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:12px;padding:8px 18px 8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--edge);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);font:600 15px var(--serif);white-space:nowrap}
.lamp{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid #7a786c;background:radial-gradient(circle at 35% 30%,#555,#222 70%);box-shadow:0 1px 0 rgba(255,255,255,.12)}
.status[data-state="connected"] .lamp{background:radial-gradient(circle at 35% 30%,#d8ffd9,var(--green) 45%,#2f7d3a);box-shadow:0 0 14px 3px rgba(111,207,121,.65)}
.status[data-state="connecting"] .lamp{background:radial-gradient(circle at 35% 30%,#fff0c4,var(--amber) 45%,#9a5d05);box-shadow:0 0 14px 3px rgba(255,180,58,.6);animation:blink 1s steps(2,end) infinite}
.status[data-state="error"] .lamp{background:radial-gradient(circle at 35% 30%,#ffd0cb,#e5362a 45%,#7d130c);box-shadow:0 0 14px 3px rgba(229,54,42,.65)}
@keyframes blink{50%{opacity:.35}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:grid;gap:22px}
.card{border:1px solid var(--edge);border-radius:14px;padding:26px 28px 28px;
  background:
   var(--screw) left 9px top 9px/13px 13px no-repeat,var(--screw) right 9px top 9px/13px 13px no-repeat,
   var(--screw) left 9px bottom 9px/13px 13px no-repeat,var(--screw) right 9px bottom 9px/13px 13px no-repeat,
   linear-gradient(180deg,var(--panel),var(--panel2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.55)}
.card h2{margin:0 0 4px;font:600 18px var(--serif);text-align:center;color:var(--cream);text-shadow:0 1px 0 #000}
.card h2::after{content:"";display:block;width:56px;height:2px;margin:7px auto 0;background:var(--brass);opacity:.8}

/* Drive pad */
.plate{width:min(100%,320px);margin:22px auto 24px;padding:16px;border-radius:18px;background:#14150f;border:1px solid #000;box-shadow:inset 0 3px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.07)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dir{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--cream);font:600 13px var(--serif);cursor:pointer;
  border:1px solid #595a50;background:linear-gradient(180deg,#46473f,#2c2d27);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 5px 0 #0b0b09,0 8px 10px rgba(0,0,0,.5);text-shadow:0 1px 0 #000;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:transform .06s,box-shadow .06s}
.dir svg{width:30px;height:30px}
.dir:hover:not(:disabled){background:linear-gradient(180deg,#505147,#32332c)}
.dir.active{transform:translateY(4px);color:#2a1a02;text-shadow:none;border-color:#e0a02a;
  background:linear-gradient(180deg,#ffd27a,#e0951f);box-shadow:inset 0 2px 5px rgba(120,60,0,.45),0 1px 0 #0b0b09,0 0 24px rgba(255,180,58,.55)}
.dir:disabled{opacity:.45;cursor:not-allowed}
.dir:focus-visible,.estop:focus-visible,.btn:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}
.hub{grid-area:2/2;margin:11%;border-radius:50%;display:grid;place-items:center;text-align:center;font:500 11px var(--mono);color:#7d7660;
  background:radial-gradient(circle at 50% 40%,#1d1c15,#050504);box-shadow:inset 0 0 0 3px #2b2b25,0 0 0 3px var(--brass),0 0 0 4px #5a4416,inset 0 3px 8px #000;transition:color .1s,box-shadow .1s}
.hub.on{color:var(--amber);text-shadow:0 0 8px rgba(255,180,58,.8);box-shadow:inset 0 0 0 3px #2b2b25,0 0 0 3px var(--brass),0 0 0 4px #5a4416,inset 0 3px 8px #000,0 0 22px rgba(255,180,58,.35)}

/* Emergency stop */
.estop{position:relative;width:100%;display:flex;align-items:center;gap:18px;padding:14px 22px;border:0;border-radius:12px;cursor:pointer;color:#1a1405;text-align:left;-webkit-tap-highlight-color:transparent;
  background:repeating-linear-gradient(-45deg,#1a1405 0 10px,var(--yellow) 10px 20px) bottom/100% 9px no-repeat,linear-gradient(180deg,#f0c443,var(--yellow));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #0b0b09,0 8px 14px rgba(0,0,0,.5);transition:transform .06s,box-shadow .06s}
.dome{width:64px;height:64px;border-radius:50%;flex:none;margin-bottom:6px;background:radial-gradient(circle at 36% 28%,#ff9185,var(--red) 45%,#6c0e08 100%);border:3px solid #1a1405;
  box-shadow:inset 0 -5px 8px rgba(0,0,0,.4),0 4px 0 #6c0e08,0 6px 8px rgba(0,0,0,.5);transition:transform .06s,box-shadow .06s}
.estop span{font:700 22px/1.1 var(--serif);margin-bottom:6px}
.estop:active,.estop.hit{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #0b0b09}
.estop:active .dome,.estop.hit .dome{transform:translateY(3px);box-shadow:inset 0 -3px 6px rgba(0,0,0,.4),0 1px 0 #6c0e08}

/* Settings */
.fields{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:22px}
.f{display:grid;gap:6px}.f.full{grid-column:span 6}.f.third{grid-column:span 2}
label{font-size:14px;color:var(--muted);font-weight:500}
input,select{width:100%;height:44px;padding:0 12px;border-radius:8px;border:1px solid #000;background:#13140f;color:var(--amber);font:400 14px var(--mono);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08);color-scheme:dark}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px}
.btn{margin-top:22px;width:100%;height:50px;border-radius:10px;cursor:pointer;color:var(--cream);font:600 17px var(--serif);text-shadow:0 1px 0 #000;
  border:1px solid #6a6a5e;background:linear-gradient(180deg,#4d4e45,#2d2e28);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 0 #0b0b09,0 7px 10px rgba(0,0,0,.5);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 #0b0b09}
.btn.on{border-color:var(--brass);color:#f1d58c}
.btn:disabled{opacity:.6;cursor:wait}

/* Console */
.console{position:relative;height:232px;margin-top:22px;overflow:auto;border-radius:10px;border:3px solid #3a3b34;background:#060704;padding:12px 14px;font:400 13px/1.65 var(--mono);color:var(--amber);
  box-shadow:inset 0 0 30px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08);scrollbar-color:#4a4636 transparent;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.line{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word;text-shadow:0 0 6px rgba(255,180,58,.35)}
.t{color:#8a7440;flex:none}.tag{flex:none;width:36px;font-weight:500}
.info .tag{color:#d1a24a}.ok .tag{color:var(--green)}.warn .tag{color:#ffd84d}.err .tag{color:#ff6b5a}.err{color:#ff8a7a}

@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.app{padding:16px 14px 32px}.card{padding:24px 20px 24px}}
@media (max-width:480px){.brand p{display:none}.brand h1{font-size:19px}.f.third{grid-column:span 3}.f.third:last-of-type{grid-column:span 6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.200 4.500-4 6.500-4 11a4 4 0 0 0 8 0c0-2.300-1-3.500-2.200-5.500-.2 1.800-.9 2.800-1.800 3.200C13 8.500 12.800 5 12 2z"/></svg></div>
      <div><h1>Firefighting Robot</h1><p>Remote controller</p></div>
    </div>
    <div class="status" id="status" data-state="disconnected" role="status" aria-live="polite"><span class="lamp"></span><span id="statusText">Disconnected</span></div>
  </header>

  <main class="grid">
    <section class="card" aria-label="Controls">
      <h2>Drive</h2>
      <div class="plate"><div class="pad">
        <button class="dir up" data-dir="Forward" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Forward</button>
        <button class="dir left" data-dir="Left" aria-label="Left" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Left</button>
        <div class="hub" id="hub">IDLE</div>
        <button class="dir right" data-dir="Right" aria-label="Right" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Right</button>
        <button class="dir down" data-dir="Backward" aria-label="Backward" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>Backward</button>
      </div></div>
      <button class="estop" id="estop" type="button"><i class="dome"></i><span>Emergency Stop</span></button>
    </section>

    <div class="col">
      <section class="card" aria-label="Hardware settings">
        <h2>Hardware Settings</h2>
        <div class="fields">
          <div class="f full"><label for="addr">ESP32 address</label><input id="addr" value="192.168.4.1" autocomplete="off" spellcheck="false" inputmode="url"></div>
          <div class="f third"><label for="proto">Protocol</label><select id="proto"><option>WebSocket</option><option>HTTP</option></select></div>
          <div class="f third"><label for="port">Port</label><input id="port" value="81" inputmode="numeric"></div>
          <div class="f third"><label for="timeout">Timeout (ms)</label><input id="timeout" value="3000" inputmode="numeric"></div>
        </div>
        <button class="btn" id="connectBtn" type="button">Connect</button>
      </section>
      <section class="card" aria-label="Diagnostic console">
        <h2>Diagnostic Console</h2>
        <div class="console" id="console" role="log" aria-live="polite"></div>
      </section>
    </div>
  </main>
</div>

<script>
(function(){
  var statusEl=document.getElementById('status'),statusText=document.getElementById('statusText');
  var consoleEl=document.getElementById('console'),hub=document.getElementById('hub');
  var connectBtn=document.getElementById('connectBtn'),estop=document.getElementById('estop');
  var dirs=[].slice.call(document.querySelectorAll('.dir'));
  var state='disconnected',held=null;
  var labels={connected:'Connected',connecting:'Connecting…',disconnected:'Disconnected',error:'Error'};

  function log(kind,msg){
    var d=document.createElement('div');d.className='line '+kind;
    var t=document.createElement('span');t.className='t';t.textContent=new Date().toLocaleTimeString('en-GB');
    var g=document.createElement('span');g.className='tag';g.textContent={info:'INFO',ok:'OK',warn:'WARN',err:'ERR'}[kind];
    var m=document.createElement('span');m.textContent=msg;
    d.appendChild(t);d.appendChild(g);d.appendChild(m);consoleEl.appendChild(d);
    while(consoleEl.children.length>100)consoleEl.removeChild(consoleEl.firstChild);
    consoleEl.scrollTop=consoleEl.scrollHeight;
  }
  function setState(s){
    state=s;statusEl.dataset.state=s;statusText.textContent=labels[s];
    dirs.forEach(function(b){b.disabled=s!=='connected'});
    connectBtn.textContent=s==='connected'?'Disconnect':s==='connecting'?'Connecting…':'Connect';
    connectBtn.classList.toggle('on',s==='connected');
    connectBtn.disabled=s==='connecting';
    if(s!=='connected')release(true);
  }
  function press(b){
    if(state!=='connected'||held)return;
    held=b;b.classList.add('active');hub.textContent=b.dataset.dir.toUpperCase();hub.classList.add('on');
    log('info',b.dataset.dir+' requested');
  }
  function release(silent){
    if(!held)return;
    held.classList.remove('active');held=null;hub.textContent='IDLE';hub.classList.remove('on');
    if(!silent)log('ok','Stop requested');
  }
  dirs.forEach(function(b){
    b.addEventListener('pointerdown',function(e){e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}press(b)});
    ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){b.addEventListener(ev,function(){if(held===b)release()})});
    b.addEventListener('contextmenu',function(e){e.preventDefault()});
    b.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();press(b)}});
    b.addEventListener('keyup',function(e){if((e.key===' '||e.key==='Enter')&&held===b)release()});
    b.addEventListener('blur',function(){if(held===b)release()});
  });
  window.addEventListener('blur',function(){release()});

  estop.addEventListener('click',function(){
    release(true);estop.classList.add('hit');setTimeout(function(){estop.classList.remove('hit')},200);
    log('warn','Emergency stop requested');
  });

  function connect(){
    var addr=document.getElementById('addr').value.trim(),port=document.getElementById('port').value.trim(),
        proto=document.getElementById('proto').value,to=parseInt(document.getElementById('timeout').value,10);
    var url=(proto==='WebSocket'?'ws://':'http://')+addr+(port?':'+port:'');
    setState('connecting');log('info','Connecting to '+url+' …');
    setTimeout(function(){
      if(!addr||!/^[\w.\-]+$/.test(addr)||!(to>0)){
        setState('error');log('err','Could not connect. Check the address and timeout, then try again.');
      }else{
        setState('connected');log('ok','Connected to '+url);
      }
    },1100);
  }
  connectBtn.addEventListener('click',function(){
    if(state==='connected'){setState('disconnected');log('info','Disconnected');}
    else connect();
  });

  log('info','Controller ready');
  connect();
})();
</script>
</body>
</html>
